<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muse AI Stylist Dashboard</title>
    <!-- Google Fonts: EB Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

    <style>
        /* Apply EB Garamond globally */
        * {
            font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
        }

        /* Soft Coquette Editorial Color Palette Design */
        body { 
            font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; 
            background: #FFE5EC; /* Light Pink Background */
            color: #4A1525; /* Deep Velvet Wine Text */
            max-width: 600px; 
            margin: 50px auto; 
            padding: 20px; 
            font-size: 18px;
        }
        .card { 
            background: #FFF0F5; /* Soft Peach / Lavender Blush Container */
            padding: 32px; 
            border-radius: 20px; 
            box-shadow: 0 8px 24px rgba(74, 21, 37, 0.1); 
            border: 2px solid #FFC2D1; 
        }
        h2 { 
            font-family: 'EB Garamond', Georgia, serif;
            color: #4A1525; /* Velvet Accent Heading */
            margin-top: 0;
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        label { 
            font-family: 'EB Garamond', Georgia, serif;
            display: block; 
            margin: 20px 0 8px; 
            font-weight: 600; 
            color: #4A1525; 
            font-size: 19px;
            letter-spacing: 0.3px;
        }
        input[type="file"], textarea { 
            font-family: 'EB Garamond', Georgia, serif;
            width: 100%; 
            padding: 12px; 
            background: #FFFFFF; 
            border: 2px solid #FFC2D1; 
            border-radius: 10px; 
            color: #4A1525; 
            box-sizing: border-box; 
            font-size: 17px;
        }
        textarea:focus, input[type="file"]:focus {
            outline: none;
            border-color: #A2D2FF; /* Soft Blue Focus Ring */
        }
        .row { 
            display: flex; 
            align-items: center; 
            margin: 20px 0; 
            gap: 12px; 
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #4A1525;
        }
        button { 
            font-family: 'EB Garamond', Georgia, serif;
            background: #BDE0FE; /* Soft Blue Button Background */
            color: #4A1525; /* Velvet Button Text */
            border: none; 
            padding: 14px 20px; 
            font-size: 20px; 
            font-weight: 700; 
            letter-spacing: 0.5px;
            border-radius: 10px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 15px; 
            box-shadow: 0 4px 10px rgba(189, 224, 254, 0.4);
            transition: all 0.2s ease;
        }
        button:hover { 
            background: #A2D2FF; /* Slightly Deeper Soft Blue on Hover */
            transform: translateY(-1px);
        }
        #outputBox { 
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 18px;
            margin-top: 30px; 
            background: #FFFFFF; 
            padding: 20px; 
            border-left: 5px solid #BDE0FE; 
            border-radius: 10px; 
            display: none; 
            white-space: pre-wrap; 
            line-height: 1.6;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div style="margin-bottom: 20px;">
    <a href="/" style="text-decoration: none; color: #4A1525; font-size: 19px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; background: #FFF0F5; border: 1.5px solid #FFC2D1; padding: 8px 18px; border-radius: 20px; transition: all 0.2s ease;">
        ← Back to Smart Wardrobe & Planner
    </a>
</div>

<div class="card">
    <h2>✨ Muse AI Styling Assistant</h2>
    
    <!-- File Input Slot -->
    <label for="outfitFile">Upload Your Outfit Image:</label>
    <input type="file" id="outfitFile" accept="image/*">

    <!-- Image Preview Slot -->
    <div id="previewContainer" class="hidden" style="margin-top: 15px; text-align: center;">
        <img id="imagePreview" src="" alt="Outfit preview" style="max-width: 100%; max-height: 320px; border-radius: 12px; border: 2px solid #FFC2D1; object-fit: contain;">
    </div>

    <div class="row">
        <input type="checkbox" id="hasQ" onchange="toggleQuestionBox()">
        <label style="margin:0; user-select: none;" for="hasQ">I have a specific question about the fit / style</label>
    </div>

    <div id="questionContainer" class="hidden">
        <label for="userQ">Your Question:</label>
        <textarea id="userQ" rows="3" placeholder="e.g., Does this match with New Year's celebration? Gold or silver jewelry? What shoes should I pair?"></textarea>
    </div>

    <button id="analyzeBtn" onclick="uploadAndAnalyze()">Analyze My Vibe 🚀</button>

    <div id="outputBox">Waiting for response...</div>
</div>

<script>
    const fileInput = document.getElementById('outfitFile');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');

    fileInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                previewContainer.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        } else {
            previewContainer.classList.add('hidden');
        }
    });

    function toggleQuestionBox() {
        const checkbox = document.getElementById('hasQ');
        const container = document.getElementById('questionContainer');
        if(checkbox.checked) {
            container.classList.remove('hidden');
        } else {
            container.classList.add('hidden');
        }
    }

    async function uploadAndAnalyze() {
        const outBox = document.getElementById('outputBox');
        const analyzeBtn = document.getElementById('analyzeBtn');
        
        if (fileInput.files.length === 0) {
            alert("Please choose an image file (JPG or PNG) from your computer first!");
            return;
        }

        const file = fileInput.files[0];
        if (file.size > 15 * 1024 * 1024) {
            alert("File is too large! Please choose an image smaller than 15MB.");
            return;
        }

        outBox.style.display = "block";
        outBox.innerText = "Analyzing your outfit and personal vibe... 💕";

        analyzeBtn.disabled = true;
        analyzeBtn.style.opacity = "0.7";
        analyzeBtn.innerText = "Styling your look... ✨";

        // Create multipart form payload for handling raw physical binary images
        const formData = new FormData();
        formData.append('outfitImage', file);
        formData.append('hasQuestion', document.getElementById('hasQ').checked);
        formData.append('userQuestion', document.getElementById('userQ').value);
        formData.append('demoMode', 'true');

        // Dynamically detect base URL so it works both on localhost:5000 and file://
        const apiUrl = window.location.origin.startsWith('http') 
            ? '/api/ai/detect-aesthetic' 
            : 'http://localhost:5000/api/ai/detect-aesthetic';

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                body: formData 
            });

            const data = await response.json();
            console.log("Raw Server Response:", data);

            if (data.success && (data.text || data.results)) {
                outBox.innerText = data.text || (typeof data.results === 'string' ? data.results : JSON.stringify(data.results, null, 2));
            } else if (data.error) {
                outBox.innerText = "⚠️ " + data.error;
            } else {
                outBox.innerText = "⚠️ Server responded, but could not parse the result: " + JSON.stringify(data);
            }
        } catch (error) {
            console.error("Fetch failed:", error);
            outBox.innerText = "❌ Connection Failed! Ensure your backend node server is running on http://localhost:5000.\n(" + error.message + ")";
        } finally {
            analyzeBtn.disabled = false;
            analyzeBtn.style.opacity = "1";
            analyzeBtn.innerText = "Analyze My Vibe 🚀";
        }
    }
</script>
</body>
</html>
